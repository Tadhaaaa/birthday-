<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<!-- ============================================================
  🎂 BIRTHDAY SURPRISE WEBSITE
  ============================================================
  FONTS & EXTERNAL RESOURCES
  ============================================================ -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

<style>

/* ============================================================
   🎨 CUSTOMIZATION — COLORS & SETTINGS
   Edit these CSS variables to change the look instantly
   ============================================================ */
:root {
  /* Background gradient colors */
  --bg-from: #1a0a2e;
  --bg-mid:  #2d1150;
  --bg-to:   #0d0522;

  /* Envelope color */
  --envelope-body: #f5e6d0;
  --envelope-flap: #edd9b8;
  --envelope-seal: #c0392b;
  --envelope-ribbon: #8b2252;

  /* Balloon colors (used in JS array) */
  /* See: BALLOON_COLORS variable in JS section */

  /* Particle / sparkle color */
  --sparkle: #ffe4a0;

  /* Letter paper */
  --letter-bg: #fffef9;
  --letter-border: #e8c9a0;

  /* Typography accent */
  --gold: #d4a843;
  --gold-light: #f5d47a;
  --pink-soft: #f9a8c9;
  --rose: #e8567a;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Cormorant Garamond', serif;
  background: radial-gradient(ellipse at 30% 20%, var(--bg-mid) 0%, var(--bg-from) 40%, var(--bg-to) 100%);
  color: #fff;
  user-select: none;
}

/* ============================================================
   CANVAS — sparkles & confetti live here
   ============================================================ */
#fxCanvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 100;
}

/* ============================================================
   MUSIC PLAYER — beautiful floating card
   ============================================================ */
#musicPlayer {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  width: clamp(290px, 80vw, 420px);
  background: rgba(15, 5, 35, 0.72);
  border: 1px solid rgba(245, 212, 122, 0.22);
  border-radius: 20px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.45),
    0 0 0 1px rgba(255,255,255,0.04),
    inset 0 1px 0 rgba(255,255,255,0.07);
  padding: 16px 20px 14px;
  transition: opacity 0.4s, transform 0.4s;
}

/* album art area */
#playerAlbumRow {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}
#playerAlbumArt {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, #c0392b 0%, #8b2252 40%, #3d1a6e 100%);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 16px rgba(192,57,43,0.4);
  position: relative;
  overflow: hidden;
  animation: albumSpin 8s linear infinite paused;
}
#playerAlbumArt.playing { animation-play-state: running; }
@keyframes albumSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
#playerAlbumArt::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18) 0%, transparent 60%);
  border-radius: 12px;
}

#playerInfo { flex: 1; min-width: 0; }
#playerSong {
  font-family: 'Playfair Display', serif;
  font-size: 14px;
  font-weight: 400;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
  margin-bottom: 3px;
}
#playerArtist {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.04em;
  font-style: italic;
}

/* No-file notice */
#playerNoFile {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11.5px;
  color: rgba(245,212,122,0.65);
  font-style: italic;
  margin-top: 4px;
  letter-spacing: 0.02em;
}

/* progress bar */
#playerProgressWrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
#playerTime, #playerDuration {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  min-width: 32px;
  letter-spacing: 0.02em;
}
#playerDuration { text-align: right; }
#playerProgress {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
  outline: none;
  cursor: pointer;
  position: relative;
}
#playerProgress::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  box-shadow: 0 0 6px rgba(212,168,67,0.6);
  cursor: pointer;
  transition: transform 0.15s;
}
#playerProgress::-webkit-slider-thumb:hover { transform: scale(1.3); }
#playerProgress::-webkit-slider-runnable-track {
  background: linear-gradient(to right, var(--gold) 0%, var(--gold) var(--progress, 0%), rgba(255,255,255,0.12) var(--progress, 0%));
  border-radius: 2px;
  height: 3px;
}

/* controls */
#playerControls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
.player-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: rgba(255,255,255,0.6);
  font-size: 16px;
  padding: 6px;
  border-radius: 50%;
  transition: color 0.2s, transform 0.15s, background 0.2s;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.player-btn:hover { color: #fff; transform: scale(1.1); }

#playerPlayBtn {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--rose), #c0392b);
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  box-shadow: 0 4px 16px rgba(232,86,122,0.45);
  transition: transform 0.2s, box-shadow 0.2s;
}
#playerPlayBtn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(232,86,122,0.6);
}

/* volume row */
#playerVolumeRow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
#playerVolIcon { font-size: 13px; color: rgba(255,255,255,0.4); }
#playerVolume {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 2px;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
  outline: none;
  cursor: pointer;
}
#playerVolume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  cursor: pointer;
}

/* pulsing equaliser bars (shows when playing) */
#playerEq {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 14px;
  opacity: 0;
  transition: opacity 0.3s;
}
#playerEq.active { opacity: 1; }
.eq-bar {
  width: 3px;
  border-radius: 2px;
  background: linear-gradient(to top, var(--rose), var(--gold-light));
  animation: eqBounce 0.6s ease-in-out infinite alternate;
}
.eq-bar:nth-child(1){ height: 6px;  animation-duration: 0.5s; }
.eq-bar:nth-child(2){ height: 12px; animation-duration: 0.7s; }
.eq-bar:nth-child(3){ height: 8px;  animation-duration: 0.4s; }
.eq-bar:nth-child(4){ height: 14px; animation-duration: 0.6s; }
.eq-bar:nth-child(5){ height: 5px;  animation-duration: 0.8s; }
@keyframes eqBounce {
  from { transform: scaleY(0.3); }
  to   { transform: scaleY(1);   }
}

/* floating music notes */
.music-note {
  position: fixed;
  pointer-events: none;
  z-index: 490;
  font-size: clamp(14px,2vw,20px);
  color: rgba(245,212,122,0.75);
  animation: noteFloat linear forwards;
}
@keyframes noteFloat {
  0%   { opacity:0; transform: translateY(0) scale(0.6) rotate(var(--nr)); }
  15%  { opacity:1; }
  85%  { opacity:0.7; }
  100% { opacity:0; transform: translateY(var(--ny)) scale(1) rotate(var(--nr2)); }
}

/* ============================================================
   FAIRY LIGHTS — top decoration
   ============================================================ */
.lights-row {
  position: fixed; top: 0; left: 0; width: 100%;
  height: 60px;
  display: flex;
  align-items: flex-start;
  padding-top: 2px;
  pointer-events: none;
  z-index: 10;
  justify-content: space-around;
}
.light-wire {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 30px;
}
.light-wire svg { width: 100%; height: 30px; }
.light-bulb {
  width: 10px; height: 14px;
  border-radius: 50% 50% 40% 40%;
  position: absolute;
  top: 18px;
  box-shadow: 0 0 8px 3px currentColor, 0 0 20px 6px currentColor;
  animation: twinkle 2s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0%   { opacity: 1; }
  100% { opacity: 0.3; }
}

/* ============================================================
   SCENE WRAPPER
   ============================================================ */
#scene {
  position: fixed; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(20px, 5vw, 80px);
  padding: 60px 20px 20px;
  transition: opacity 0.6s;
}

/* ============================================================
   BOUQUET
   ============================================================ */
#bouquet {
  position: relative;
  width: clamp(180px, 28vw, 320px);
  flex-shrink: 0;
  animation: sway 5s ease-in-out infinite;
  transform-origin: bottom center;
  filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
}
#bouquet svg { width: 100%; height: auto; }

@keyframes sway {
  0%   { transform: rotate(-2deg) translateY(0px); }
  50%  { transform: rotate(2deg) translateY(-6px); }
  100% { transform: rotate(-2deg) translateY(0px); }
}

/* sparkle dots around bouquet */
.sparkle-dot {
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--sparkle);
  box-shadow: 0 0 8px 3px var(--sparkle);
  animation: sparklePulse 2.5s ease-in-out infinite;
}
@keyframes sparklePulse {
  0%,100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.4); }
}

/* ============================================================
   ENVELOPE
   ============================================================ */
#envelopeWrap {
  position: relative;
  width: clamp(200px, 32vw, 360px);
  flex-shrink: 0;
  cursor: pointer;
  filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
}
#envelopeWrap:hover #envelope { transform: translateY(-6px) scale(1.02); }
#envelopeWrap:hover #envelopeGlow { opacity: 0.6; }

#envelope {
  position: relative;
  transition: transform 0.4s ease;
}
#envelopeGlow {
  position: absolute;
  inset: -20px;
  background: radial-gradient(ellipse, rgba(212,168,67,0.35) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

/* name label on envelope */
#envelopeName {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Great Vibes', cursive;
  font-size: clamp(18px, 3vw, 28px);
  color: #5a3310;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(255,255,255,0.4);
  pointer-events: none;
}

/* click hint */
#clickHint {
  text-align: center;
  margin-top: 14px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(13px, 2vw, 16px);
  color: rgba(255,255,255,0.55);
  animation: fadeFloat 2.5s ease-in-out infinite;
}
@keyframes fadeFloat {
  0%,100% { opacity: 0.4; transform: translateY(0); }
  50%      { opacity: 0.9; transform: translateY(-4px); }
}

/* ============================================================
   ENVELOPE SVG ANIMATIONS
   ============================================================ */
#envFlap {
  transform-origin: 50% 0%;
  transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
}
.env-opened #envFlap {
  transform: rotateX(180deg);
  opacity: 0.6;
}

/* ============================================================
   BALLOONS
   ============================================================ */
.balloon {
  position: fixed;
  width: 50px; height: 62px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  animation: none;
}
.balloon-string {
  position: absolute;
  bottom: -18px; left: 50%;
  width: 1px; height: 20px;
  background: rgba(255,255,255,0.5);
  transform: translateX(-50%);
}
.balloon::after {
  content: '';
  position: absolute;
  top: 18%; left: 22%;
  width: 28%; height: 18%;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  transform: rotate(-30deg);
}

@keyframes balloonRise {
  0%   { opacity: 0; transform: translateY(60px) scale(0.4); }
  20%  { opacity: 1; transform: translateY(0px) scale(1); }
  100% { opacity: 1; transform: translateY(var(--rise-y)) scale(1); }
}
@keyframes balloonFloat {
  0%,100% { transform: translateY(var(--float-base)) rotate(-2deg); }
  50%      { transform: translateY(calc(var(--float-base) - 14px)) rotate(2deg); }
}

/* ============================================================
   LETTER
   ============================================================ */
#letterWrap {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 300;
  opacity: 0;
  transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s;
  width: clamp(280px, 70vw, 520px);
  max-height: 90vh;
  overflow-y: auto;
}
#letterWrap.visible {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
#letter {
  background: var(--letter-bg);
  border: 1px solid var(--letter-border);
  border-radius: 4px;
  padding: clamp(24px, 5vw, 48px);
  box-shadow:
    0 4px 6px rgba(0,0,0,0.05),
    0 10px 40px rgba(0,0,0,0.2),
    0 30px 80px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.8);
  position: relative;
  overflow: hidden;
}
/* paper texture lines */
#letter::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    transparent, transparent 27px,
    rgba(200,180,150,0.18) 28px
  );
  pointer-events: none;
}
/* decorative top corner */
#letter::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 80px; height: 80px;
  background: linear-gradient(135deg, rgba(212,168,67,0.12) 0%, transparent 60%);
  pointer-events: none;
}

.letter-header {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(26px, 5vw, 42px);
  color: var(--rose);
  text-align: center;
  margin-bottom: 16px;
  text-shadow: 0 2px 8px rgba(232,86,122,0.2);
  position: relative;
}
.letter-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 8px 0 20px;
}
.letter-divider span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--letter-border), transparent); }
.letter-divider-icon { color: var(--gold); font-size: 14px; }

.letter-body {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(14px, 2.2vw, 18px);
  line-height: 1.85;
  color: #3d2a1a;
  min-height: 80px;
  position: relative;
}
.letter-body .cursor {
  display: inline-block;
  width: 2px; height: 1.1em;
  background: var(--rose);
  vertical-align: middle;
  animation: blink 0.8s step-end infinite;
  margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* optional photo inside letter */
#letterPhoto {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 3px;
  margin: 16px 0;
  border: 1px solid var(--letter-border);
  display: none; /* shown if PHOTO_URL is set */
}

.letter-from {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(20px, 3.5vw, 30px);
  color: var(--rose);
  text-align: right;
  margin-top: 24px;
}

.letter-close-btn {
  display: block;
  margin: 20px auto 0;
  background: none;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  padding: 8px 24px;
  border-radius: 20px;
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
}
.letter-close-btn:hover { background: var(--gold); color: #1a0a2e; }

/* ============================================================
   HAPPY BIRTHDAY TITLE
   ============================================================ */
#hbTitle {
  position: fixed;
  top: 6%;
  left: 0; width: 100%;
  text-align: center;
  font-family: 'Great Vibes', cursive;
  font-size: clamp(32px, 7vw, 80px);
  background: linear-gradient(135deg, var(--gold-light), var(--pink-soft), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
  transform: translateY(-30px) scale(0.85);
  transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.34,1.56,0.64,1);
  text-shadow: none;
  z-index: 400;
  pointer-events: none;
  filter: drop-shadow(0 0 20px rgba(245,212,122,0.5));
}
#hbTitle.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* ============================================================
   FLOATING HEARTS
   ============================================================ */
.heart {
  position: fixed;
  font-size: clamp(14px, 2vw, 24px);
  opacity: 0;
  pointer-events: none;
  z-index: 50;
  animation: heartFloat linear forwards;
}
@keyframes heartFloat {
  0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(var(--rot)); }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.6; }
  100% { opacity: 0; transform: translateY(var(--rise)) scale(1.2) rotate(var(--rot2)); }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 580px) {
  #scene {
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 30px;
    gap: 10px;
  }
  #bouquet { width: 55vw; }
  #envelopeWrap { width: 70vw; }
}

</style>
</head>
<body>

<!-- ============================================================
  AUDIO — drop your mp3 filename in the source tag below
  ============================================================ -->
<audio id="bgMusic" loop preload="auto">
<source src="lover-live-paris.mp3" type="audio/mpeg">
</audio>

<canvas id="fxCanvas"></canvas>

<!-- MUSIC PLAYER CARD -->
<div id="musicPlayer">
  <div id="playerAlbumRow">
    <div id="playerAlbumArt">🌹</div>
    <div id="playerInfo">
      <div id="playerSong">Lover (Live from Paris)</div>
      <div id="playerArtist">Taylor Swift</div>
      <div id="playerNoFile">✦ Add mp3 to enable playback</div>
    </div>
    <div id="playerEq">
      <div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
  </div>
  <div id="playerProgressWrap">
    <span id="playerTime">0:00</span>
    <input type="range" id="playerProgress" min="0" max="100" value="0" step="0.1">
    <span id="playerDuration">0:00</span>
  </div>
  <div id="playerControls">
    <button class="player-btn" id="playerRewindBtn" title="Rewind 10s">⟨10</button>
    <button class="player-btn" id="playerPlayBtn" title="Play / Pause"><span id="playerPlayIcon">▶</span></button>
    <button class="player-btn" id="playerForwardBtn" title="Forward 10s">10⟩</button>
  </div>
  <div id="playerVolumeRow">
    <span id="playerVolIcon">♪</span>
    <input type="range" id="playerVolume" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>

<!-- Fairy Lights -->
<div class="lights-row" id="lightsRow"></div>

<!-- Happy Birthday Title (shown after opening) -->
<div id="hbTitle"></div>

<!-- ============================================================
  MAIN SCENE
  ============================================================ -->
<div id="scene">

  <!-- BOUQUET -->
  <div id="bouquet">
    <!-- Sparkle dots -->
    <div class="sparkle-dot" style="top:10%;left:80%;animation-delay:0s;"></div>
    <div class="sparkle-dot" style="top:30%;left:-5%;animation-delay:0.6s;"></div>
    <div class="sparkle-dot" style="top:5%;left:40%;animation-delay:1.1s;"></div>
    <div class="sparkle-dot" style="top:50%;left:90%;animation-delay:0.3s;"></div>
    <div class="sparkle-dot" style="top:70%;left:5%;animation-delay:1.7s;"></div>
    <!-- SVG Bouquet -->
    <svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" id="bouquetSVG">
      <defs>
        <radialGradient id="roseG" cx="50%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#f8889a"/>
          <stop offset="60%" stop-color="#e8304a"/>
          <stop offset="100%" stop-color="#8b1a2a"/>
        </radialGradient>
        <radialGradient id="tulipG" cx="50%" cy="30%" r="55%">
          <stop offset="0%" stop-color="#ffbbd0"/>
          <stop offset="100%" stop-color="#e8567a"/>
        </radialGradient>
        <radialGradient id="lilyG" cx="50%" cy="30%" r="55%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="70%" stop-color="#f0ede6"/>
          <stop offset="100%" stop-color="#d9d3c8"/>
        </radialGradient>

<script>
/* ============================================================
   ✏️  EDIT YOUR CONTENT HERE — All customizable text & settings
   ============================================================ */

// --- TEXT ---
const ENVELOPE_NAME    = "My Love";            // Name shown on envelope
const LETTER_TITLE     = "Happy Birthday";     // Title inside letter
const LETTER_MESSAGE   = `My dearest love,\n\nToday the world is brighter because you are in it. Every moment with you feels like magic, and I am endlessly grateful that I get to be the one who calls you mine.\n\nWishing you a birthday as beautiful as your soul.\n\nWith all my love, always.`;
const FROM_NAME        = "Forever Yours ♡";    // Sign-off name
const HB_TITLE_TEXT    = "Happy Birthday, My Love";  // Big top title

// --- PHOTO (optional) ---
// Set to a URL or leave empty "" to hide the photo in the letter
const PHOTO_URL = "";

// --- COLORS ---
const BALLOON_COLORS = ["#f87171","#fb923c","#fbbf24","#a78bfa","#60a5fa","#f472b6","#34d399"];
const CONFETTI_COLORS = ["#f87171","#fbbf24","#60a5fa","#f472b6","#a78bfa","#34d399","#fff","#f5d47a"];

// --- SETTINGS ---
const MUSIC_ENABLED_DEFAULT = false;  // true = music starts automatically (may be blocked by browser)
const ANIMATION_SPEED       = 1;      // 0.5 = slower, 1 = normal, 2 = faster
const TYPING_SPEED_MS       = 28;     // ms per character for the typing effect

/* ============================================================
   END OF CUSTOMIZATION SECTION
   ============================================================ */

// ---- Apply text to DOM ----
document.getElementById('envelopeName').textContent = ENVELOPE_NAME;
document.getElementById('hbTitle').textContent      = HB_TITLE_TEXT;
document.getElementById('letterTitle').textContent  = LETTER_TITLE;
document.getElementById('letterFrom').textContent   = FROM_NAME;

if (PHOTO_URL) {
  const ph = document.getElementById('letterPhoto');
  ph.src = PHOTO_URL;
  ph.style.display = 'block';
}

// ---- Canvas FX setup ----
const canvas = document.getElementById('fxCanvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// FAIRY LIGHTS
// ============================================================
const lightsRow  = document.getElementById('lightsRow');
const lightHues  = ['#ffe87c','#ff87b2','#87d4ff','#b4ff87','#ffb487','#d4b4ff'];
const lightCount = Math.floor(window.innerWidth / 48);

// Wire SVG
const wireSVG = document.createElementNS('http://www.w3.org/2000/svg','svg');
wireSVG.setAttribute('viewBox',`0 0 ${window.innerWidth} 30`);
wireSVG.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:30px;';
const wirePath = document.createElementNS('http://www.w3.org/2000/svg','path');
let wireD = `M0 5 `;
for(let i=0;i<=lightCount;i++){
  const x = (i/(lightCount))*window.innerWidth;
  const mid = ((i-0.5)/(lightCount))*window.innerWidth;
  if(i>0) wireD += `Q${mid} 20 ${x} 5 `;
}
wirePath.setAttribute('d', wireD);
wirePath.setAttribute('fill','none');
wirePath.setAttribute('stroke','rgba(255,255,255,0.18)');
wirePath.setAttribute('stroke-width','1.2');
wireSVG.appendChild(wirePath);
lightsRow.appendChild(wireSVG);

for(let i=0;i<lightCount;i++){
  const bulb = document.createElement('div');
  bulb.className = 'light-bulb';
  const color = lightHues[i % lightHues.length];
  bulb.style.cssText = `
    left: ${(i/(lightCount-1))*98 + 1}%;
    color: ${color};
    background: ${color};
    animation-delay: ${Math.random()*2}s;
    animation-duration: ${1.5+Math.random()}s;
  `;
  lightsRow.appendChild(bulb);
}

// ============================================================
// SPARKLE PARTICLES (canvas)
// ============================================================
let sparkles = [];
function createSparkle(x,y,burst){
  const count = burst ? 30 : 1;
  for(let i=0;i<count;i++){
    const angle  = Math.random()*Math.PI*2;
    const speed  = burst ? (2+Math.random()*5) : (0.5+Math.random()*1.5);
    sparkles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - (burst ? 1 : 0),
      size: 2+Math.random()*3,
      life: 1,
      decay: 0.012+Math.random()*0.018,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)]
    });
  }
}

// Ambient sparkles around bouquet & envelope
setInterval(()=>{
  const bouqRect = document.getElementById('bouquet').getBoundingClientRect();
  const envRect  = document.getElementById('envelopeWrap').getBoundingClientRect();
  // around bouquet
  createSparkle(
    bouqRect.left + Math.random()*bouqRect.width,
    bouqRect.top  + Math.random()*bouqRect.height*0.6
  );
  // around envelope
  createSparkle(
    envRect.left + Math.random()*envRect.width,
    envRect.top  + Math.random()*envRect.height*0.5
  );
}, 350);

// ============================================================
// CONFETTI
// ============================================================
let confetti = [];
function launchConfetti(){
  for(let i=0;i<180;i++){
    setTimeout(()=>{
      confetti.push({
        x: Math.random()*canvas.width,
        y: -10,
        vx: (Math.random()-0.5)*4,
        vy: 2+Math.random()*4,
        rot: Math.random()*360,
        rotV: (Math.random()-0.5)*8,
        w: 6+Math.random()*8,
        h: 4+Math.random()*5,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        life: 1,
        decay: 0.004+Math.random()*0.004
      });
    }, i*30);
  }
}

// ============================================================
// CANVAS ANIMATION LOOP
// ============================================================
function animLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Sparkles
  sparkles = sparkles.filter(s=>{
    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
    if(s.life<=0) return false;
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.fillStyle   = s.color;
    // 4-point star
    ctx.beginPath();
    const r=s.size, r2=r*0.4;
    for(let k=0;k<8;k++){
      const a = (k*Math.PI/4);
      const rad = k%2===0 ? r : r2;
      k===0 ? ctx.moveTo(s.x+rad*Math.cos(a),s.y+rad*Math.sin(a))
            : ctx.lineTo(s.x+rad*Math.cos(a),s.y+rad*Math.sin(a));
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    return true;
  });

  // Confetti
  confetti = confetti.filter(c=>{
    c.x += c.vx; c.y += c.vy; c.rot += c.rotV; c.vy += 0.06; c.life -= c.decay;
    if(c.life<=0) return false;
    ctx.save();
    ctx.globalAlpha = c.life;
    ctx.translate(c.x,c.y);
    ctx.rotate(c.rot*Math.PI/180);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
    return true;
  });

  requestAnimationFrame(animLoop);
}
animLoop();

// ============================================================
// FLOATING HEARTS
// ============================================================
function spawnHeart(){
  const el = document.createElement('div');
  el.className = 'heart';
  el.textContent = Math.random()<0.6 ? '♥' : '♡';
  const colors = ['#f472b6','#fb7185','#f9a8d4','#fda4af','#e879f9'];
  el.style.cssText = `
    left: ${10+Math.random()*80}%;
    bottom: ${Math.random()*30}%;
    color: ${colors[Math.floor(Math.random()*colors.length)]};
    --rot:  ${(Math.random()-0.5)*20}deg;
    --rot2: ${(Math.random()-0.5)*30}deg;
    --rise: -${200+Math.random()*300}px;
    animation-duration: ${3+Math.random()*3}s;
    animation-delay: 0s;
    opacity: 0;
  `;
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}
setInterval(spawnHeart, 1800);

// ============================================================
// BALLOONS
// ============================================================
let balloonEls = [];

function createBalloon(index, total){
  const el    = document.createElement('div');
  el.className = 'balloon';
  const color  = BALLOON_COLORS[index % BALLOON_COLORS.length];
  el.style.background = `radial-gradient(circle at 35% 35%, ${color}cc, ${color})`;
  el.style.boxShadow  = `inset -4px -4px 10px rgba(0,0,0,0.15), 0 0 15px ${color}60`;
  const string = document.createElement('div');
  string.className = 'balloon-string';
  el.appendChild(string);

  // Start from envelope center
  const envRect = document.getElementById('envelopeWrap').getBoundingClientRect();
  const startX  = envRect.left + envRect.width/2 - 25;
  const startY  = envRect.top  + envRect.height*0.3;

  el.style.cssText += `
    left: ${startX}px; top: ${startY}px;
  `;
  document.body.appendChild(el);
  balloonEls.push(el);

  // Animate rise
  const angle  = ((index/(total-1)) - 0.5) * 200;
  const finalX = window.innerWidth/2 + angle - 25;
  const finalY = window.innerHeight * (0.12 + (index%3)*0.07);

  setTimeout(()=>{
    el.style.cssText += `
      transition: left ${1.2/ANIMATION_SPEED}s cubic-bezier(0.34,1.56,0.64,1),
                  top  ${1.4/ANIMATION_SPEED}s cubic-bezier(0.34,1.56,0.64,1),
                  opacity 0.4s;
      opacity: 1;
      left: ${finalX}px;
      top: ${finalY}px;
    `;
  }, 50);

  // After settling, add float animation
  setTimeout(()=>{
    el.style.setProperty('--float-base','0px');
    el.style.animation = `balloonFloat ${2.5+Math.random()*1.5}s ease-in-out ${Math.random()}s infinite`;
    el.style.transform = `translateY(0px)`;
  }, (1500/ANIMATION_SPEED) + index*100);

  return el;
}

// ============================================================
// TYPING ANIMATION
// ============================================================
function typeText(el, text, speed, cb){
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  let i=0;
  const lines = text.split('\n');
  function next(){
    if(i >= text.length){
      cursor.remove();
      if(cb) cb();
      return;
    }
    const ch = text[i++];
    if(ch==='\n') el.insertBefore(document.createElement('br'), cursor);
    else {
      const t = document.createTextNode(ch);
      el.insertBefore(t, cursor);
    }
    setTimeout(next, speed/ANIMATION_SPEED);
  }
  next();
}

// ============================================================
// ENVELOPE OPEN SEQUENCE
// ============================================================
let isOpened = false;

function openEnvelope(){
  if(isOpened) return;
  isOpened = true;

  // Disable click hint
  document.getElementById('clickHint').style.opacity = '0';

  // Open flap animation
  document.getElementById('envelope').classList.add('env-opened');

  // Burst sparkles at envelope
  const envRect = document.getElementById('envelopeWrap').getBoundingClientRect();
  const cx = envRect.left + envRect.width/2;
  const cy = envRect.top  + envRect.height/3;
  createSparkle(cx, cy, true);

  // Shake screen softly
  document.body.style.transition = 'filter 0.1s';
  document.body.style.filter = 'brightness(1.15)';
  setTimeout(()=>{ document.body.style.filter=''; }, 200);

  // Balloons rise after flap opens
  setTimeout(()=>{
    const balloonCount = 7;
    for(let i=0;i<balloonCount;i++){
      setTimeout(()=>createBalloon(i, balloonCount), i*120);
    }
  }, 600/ANIMATION_SPEED);

  // Confetti
  setTimeout(launchConfetti, 800/ANIMATION_SPEED);

  // Letter emerges
  setTimeout(showLetter, 1400/ANIMATION_SPEED);

  // HB title
  setTimeout(()=>{
    document.getElementById('hbTitle').classList.add('visible');
  }, 2000/ANIMATION_SPEED);

  // Auto-play music when envelope opens (if source is present)
  if(!musicPlaying && hasAudioSource){
    bgMusic.play().then(()=> setPlaying(true)).catch(()=>{});
  }
}

// ============================================================
// SHOW LETTER
// ============================================================
function showLetter(){
  const lw = document.getElementById('letterWrap');
  lw.classList.add('visible');

  // Type the message
  setTimeout(()=>{
    typeText(
      document.getElementById('letterBody'),
      LETTER_MESSAGE,
      TYPING_SPEED_MS
    );
  }, 400);

  // More sparkle bursts
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      createSparkle(
        window.innerWidth/2 + (Math.random()-0.5)*200,
        window.innerHeight/2 + (Math.random()-0.5)*150,
        true
      );
    }, i*300);
  }
}

// ============================================================
// CLOSE LETTER
// ============================================================
function closeLetter(){
  document.getElementById('letterWrap').classList.remove('visible');
}

// ============================================================
// MUSIC PLAYER
// ============================================================
const bgMusic        = document.getElementById('bgMusic');
const playerPlayBtn  = document.getElementById('playerPlayBtn');
const playerPlayIcon = document.getElementById('playerPlayIcon');
const playerProgress = document.getElementById('playerProgress');
const playerTime     = document.getElementById('playerTime');
const playerDuration = document.getElementById('playerDuration');
const playerVolume   = document.getElementById('playerVolume');
const playerAlbumArt = document.getElementById('playerAlbumArt');
const playerEq       = document.getElementById('playerEq');
const playerNoFile   = document.getElementById('playerNoFile');
const playerRewind   = document.getElementById('playerRewindBtn');
const playerForward  = document.getElementById('playerForwardBtn');

let musicPlaying = false;
let hasAudioSource = bgMusic.querySelector('source') !== null;

// Hide "add mp3" notice if source already present
if(hasAudioSource) playerNoFile.style.display = 'none';

function fmtTime(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function setPlaying(state){
  musicPlaying = state;
  playerPlayIcon.textContent = state ? '⏸' : '▶';
  playerAlbumArt.classList.toggle('playing', state);
  playerEq.classList.toggle('active', state);
  if(state) spawnMusicNotes();
}

function togglePlay(){
  if(!hasAudioSource){
    // Pulse the no-file message
    playerNoFile.style.color = '#f472b6';
    playerNoFile.textContent = '✦ Add lover-live-paris.mp3 to play';
    setTimeout(()=>{
      playerNoFile.style.color = '';
      playerNoFile.textContent = '✦ Add mp3 to enable playback';
    }, 2500);
    return;
  }
  if(musicPlaying){
    bgMusic.pause();
    setPlaying(false);
  } else {
    bgMusic.play().then(()=>{
      setPlaying(true);
      playerNoFile.style.display = 'none';
    }).catch(()=>{
      playerNoFile.style.display = 'block';
      playerNoFile.textContent = '✦ Browser blocked autoplay — try again';
    });
  }
}

playerPlayBtn.addEventListener('click', togglePlay);

// Rewind / Forward
playerRewind.addEventListener('click',()=>{ bgMusic.currentTime = Math.max(0, bgMusic.currentTime-10); });
playerForward.addEventListener('click',()=>{ bgMusic.currentTime = Math.min(bgMusic.duration||0, bgMusic.currentTime+10); });

// Progress bar — update as song plays
bgMusic.addEventListener('timeupdate',()=>{
  if(!bgMusic.duration) return;
  const pct = (bgMusic.currentTime / bgMusic.duration) * 100;
  playerProgress.value = pct;
  playerProgress.style.setProperty('--progress', pct + '%');
  playerTime.textContent     = fmtTime(bgMusic.currentTime);
  playerDuration.textContent = fmtTime(bgMusic.duration);
});

bgMusic.addEventListener('loadedmetadata',()=>{
  playerDuration.textContent = fmtTime(bgMusic.duration);
});

bgMusic.addEventListener('ended',()=> setPlaying(false));

// Seek
playerProgress.addEventListener('input',()=>{
  if(!bgMusic.duration) return;
  bgMusic.currentTime = (playerProgress.value/100)*bgMusic.duration;
});

// Volume
bgMusic.volume = 0.7;
playerVolume.addEventListener('input',()=>{
  bgMusic.volume = playerVolume.value;
  document.getElementById('playerVolIcon').textContent =
    playerVolume.value == 0 ? '🔇' : playerVolume.value < 0.4 ? '🔈' : '♪';
});

// Auto-play if default is true
if(MUSIC_ENABLED_DEFAULT && hasAudioSource){
  bgMusic.play().then(()=> setPlaying(true)).catch(()=>{});
}

// Floating music notes when playing
let noteInterval = null;
function spawnMusicNotes(){
  if(noteInterval) return;
  noteInterval = setInterval(()=>{
    if(!musicPlaying){ clearInterval(noteInterval); noteInterval=null; return; }
    const el = document.createElement('div');
    el.className = 'music-note';
    el.textContent = ['♩','♪','♫','♬'][Math.floor(Math.random()*4)];
    const playerRect = document.getElementById('musicPlayer').getBoundingClientRect();
    el.style.cssText = `
      left: ${playerRect.left + Math.random()*playerRect.width}px;
      top:  ${playerRect.top - 10}px;
      --nr:  ${(Math.random()-0.5)*20}deg;
      --nr2: ${(Math.random()-0.5)*40}deg;
      --ny:  -${80+Math.random()*120}px;
      animation-duration: ${2.5+Math.random()*2}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=> el.remove());
  }, 900);
}

// ============================================================
// TOUCH SUPPORT — long press / tap for envelope
// ============================================================
let touchStart = 0;
document.getElementById('envelopeWrap').addEventListener('touchstart', e=>{
  touchStart = Date.now();
});
document.getElementById('envelopeWrap').addEventListener('touchend', e=>{
  if(Date.now()-touchStart < 600) openEnvelope();
  e.preventDefault();
},{passive:false});

// ============================================================
// KEYBOARD: press Enter or Space to open
// ============================================================
window.addEventListener('keydown', e=>{
  if(e.key==='Enter'||e.key===' ') openEnvelope();
});

</script>
